<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sole Rebel Orders</title><style>:root{--bg:#171715;--paper:#f3f0e8;--line:#474640;--text:#f7f4ec;--ink:#111;--muted:#aaa69c;--lime:#c9ff33;--red:#d45247}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}.wrap{max-width:1180px;margin:auto;padding:18px}.eyebrow{font-size:.72rem;letter-spacing:.18em;text-transform:uppercase;font-weight:800}.brand{font:700 clamp(3rem,8vw,5.6rem) Georgia,serif;margin:.25rem 0}.sub{color:#cbc7bc;margin:.25rem 0 1.4rem}.top{display:flex;justify-content:space-between;align-items:end;gap:18px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:24px}.actions{display:flex;gap:10px}.btn{padding:11px 15px;border:1px solid #5b5a54;background:transparent;color:#fff;cursor:pointer;font-weight:700;text-decoration:none}.btn.primary{background:#111;color:#fff;border-color:#111}.btn.light{background:#fff;color:#111;border-color:#111}.metrics{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:28px 0 20px}.metric{border:1px solid var(--line);padding:18px 22px;min-height:105px}.metric small{display:block;color:#bdb9ae;letter-spacing:.14em;text-transform:uppercase;margin-bottom:10px}.metric strong{font:700 1.8rem Georgia,serif}.orders{display:grid;gap:18px}.order{background:var(--paper);color:var(--ink);padding:28px 34px}.order .btn{color:#111;border-color:#111;background:transparent}.order .btn.primary{background:#111;color:#fff;border-color:#111}.order .btn.light{background:#fff;color:#111;border-color:#111}.order-head{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #cbc7bc;padding-bottom:18px}.new{display:inline-block;background:var(--lime);padding:5px 9px;font-size:.66rem;font-weight:900;letter-spacing:.14em;text-transform:uppercase}.name{font:700 2rem Georgia,serif;margin:.6rem 0 .25rem}.meta{font-size:.8rem;color:#6b675e}.total{font:700 2rem Georgia,serif;text-align:right}.pill{display:inline-flex;gap:7px;align-items:center;border:1px solid #222;padding:8px 11px;font-size:.78rem;font-weight:700;margin-top:8px}.dot{width:8px;height:8px;border-radius:50%;background:var(--red)}.dot.good{background:#4d9a53}.order-grid{display:grid;grid-template-columns:1fr 1fr;gap:32px;padding-top:20px}.label{font-size:.68rem;letter-spacing:.16em;text-transform:uppercase;color:#6b675e;font-weight:900;margin-bottom:10px}.line{margin:7px 0}.payment-status{margin-top:14px;padding:12px 14px;background:#e8e4da;border-left:4px solid #111}.payment-status.clicked{border-left-color:#b28e00}.payment-status.reported{border-left-color:#d07c00}.payment-status.paid{border-left-color:#4d9a53}.special,.tracking{grid-column:1/-1;background:#e6e2d8;padding:16px;margin-top:8px}.tracking{background:#dedad0}.tracking-grid{display:grid;grid-template-columns:160px 1fr auto;gap:8px;align-items:end}.tracking select,.tracking input{margin:0;width:100%;padding:11px;border:1px solid #aaa;background:#fff;color:#111}.notify-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}.admin-row{display:flex;gap:8px;flex-wrap:wrap;margin-top:15px}.hidden{display:none!important}.login{max-width:430px;margin:12vh auto;padding:26px;border:1px solid var(--line)}#password{width:100%;padding:13px;margin:12px 0;background:#111;border:1px solid var(--line);color:#fff}@media(max-width:760px){.metrics{grid-template-columns:1fr 1fr}.order-grid{grid-template-columns:1fr}.order{padding:22px}.order-head{flex-direction:column}.total{text-align:left}.tracking-grid{grid-template-columns:1fr}}@media(max-width:500px){.metrics{grid-template-columns:1fr}}</style></head><body><div id="login" class="login"><div class="eyebrow">Private fulfillment</div><h1 class="brand" style="font-size:3rem">Sole Rebel</h1><input id="password" type="password" placeholder="Admin password"><button class="btn primary" id="loginBtn">Open Dashboard</button><div id="err" class="sub"></div></div><main id="app" class="wrap hidden"><div class="top"><div><div class="eyebrow">Private fulfillment</div><h1 class="brand">Sole Rebel Orders</h1><div class="sub">Everything you need to prepare, match payment, ship, and notify customers.</div></div><div class="actions"><a class="btn" href="/">View order form</a><button class="btn" id="logoutBtn">Sign out</button></div></div><section id="metrics" class="metrics"></section><div style="display:flex;justify-content:flex-end;margin:12px 0 18px"><button class="btn" id="refreshBtn">Refresh</button></div><section id="orders" class="orders"></section></main><script>const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toFixed(2);async function req(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}function metric(label,value){return`<div class="metric"><small>${label}</small><strong>${value}</strong></div>`}function esc(v=''){return String(v).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function payBlock(o){const m=o.metadata||{};if(o.status==='paid')return`<div class="payment-status paid"><strong>Payment verified</strong>${m.paymentReportedMethod?` · ${esc(m.paymentReportedMethod)}`:''}</div>`;if(m.paymentReported)return`<div class="payment-status reported"><strong>Customer reports payment sent</strong> via ${esc(m.paymentReportedMethod||'payment app')}<br><small>${m.paymentReportedAt?new Date(m.paymentReportedAt).toLocaleString():''}</small></div>`;if(m.paymentLinkClicked)return`<div class="payment-status clicked"><strong>${esc((m.paymentMethodClicked||'payment').toUpperCase())} link clicked</strong><br><small>${m.paymentLinkClickedAt?new Date(m.paymentLinkClickedAt).toLocaleString():''}</small></div>`;return`<div class="payment-status"><strong>Payment link not clicked</strong></div>`}function address(m){const a=m.address||{};const parts=[a.street,a.street2,[a.city,a.state,a.zip].filter(Boolean).join(', ')].filter(Boolean);return parts.map(esc).join('<br>')||'—'}function phone(m){const raw=String(m.contact||'');if(raw.includes('@'))return'';const d=raw.replace(/\D/g,'');return d.length>=10?d:''}function email(m){if(m.email&&String(m.email).includes('@'))return String(m.email);const c=String(m.contact||'');return c.includes('@')?c:''}function trackingMessage(o){const m=o.metadata||{},num=m.trackingNumber||'',carrier=(m.trackingCarrier||'').toUpperCase(),url=m.trackingUrl||'';return`Your Sole Rebel order ${o.friendly_order_number||o.external_order_id} has shipped!${carrier?` Carrier: ${carrier}.`:''} Tracking: ${num}.${url?` Track it here: ${url}`:''} Thank you for your order!`}function notifyLinks(o){const m=o.metadata||{};if(!m.trackingNumber)return'';const msg=encodeURIComponent(trackingMessage(o)),p=phone(m),e=email(m);return`<div class="notify-row">${p?`<a class="btn primary" href="sms:${p}?body=${msg}">Text tracking</a>`:''}${e?`<a class="btn primary" href="mailto:${encodeURIComponent(e)}?subject=${encodeURIComponent('Your Sole Rebel order has shipped')}&body=${msg}">Email tracking</a>`:''}${m.trackingUrl?`<a class="btn light" target="_blank" rel="noopener" href="${esc(m.trackingUrl)}">Open tracking</a>`:''}${!p&&!e?'<small>No phone/email contact saved for this order.</small>':''}</div>`}async function load(){const d=await req('/api/admin/dashboard'),s=d.stats;$('#metrics').innerHTML=[metric('Total orders',s.lifetime),metric('Order value',money(s.order_value)),metric('Payment reported',s.payment_reported||0),metric('Paid',s.paid||0),metric('Unpaid',s.unpaid||0),metric('Paid revenue',money(s.paid_revenue))].join('');$('#orders').innerHTML=d.orders.map(o=>{const m=o.metadata||{};const pairs=m.pairs||1,days=m.daysWorn||1,id=esc(o.id),orderNo=esc(o.friendly_order_number||o.external_order_id);return`<article class="order"><div class="order-head"><div><span class="new">${o.status==='paid'?'Paid order':'New order'}</span><div class="name">${esc(m.customer||'Customer')}</div><div class="meta"><strong>${orderNo}</strong> · ${new Date(o.ordered_at).toLocaleString()}</div></div><div><div class="total">${money(o.total)}</div><div class="pill"><span class="dot ${o.status==='paid'?'good':''}"></span>${o.status==='paid'?'Paid':o.status==='payment_reported'?'Payment reported':'Not paid'}</div></div></div><div class="order-grid"><div><div class="label">Order</div><div class="line">● ${pairs} Pair${pairs>1?'s':''} · ${esc(m.color||'—')}</div><div class="line">${days} Day${days>1?'s':''} Worn At $25/Day</div><div class="line"><small>Includes $6 Flat-Rate Shipping</small></div><div class="label" style="margin-top:20px">Contact</div><div>${esc(m.contact||m.email||'—')}</div></div><div><div class="label">Ship to</div><div>${esc(m.customer||'—')}<br>${address(m)}</div>${payBlock(o)}</div><div class="special"><div class="label">Special request</div>${esc(m.specialRequest||'No special request')}</div><div class="tracking"><div class="label">Shipping tracking</div>${m.trackingNumber?`<div><strong>${esc((m.trackingCarrier||'other').toUpperCase())}</strong> · ${esc(m.trackingNumber)}${m.trackingAddedAt?`<br><small>Added ${new Date(m.trackingAddedAt).toLocaleString()}</small>`:''}</div>`:''}<div class="tracking-grid" style="margin-top:10px"><select id="carrier-${id}"><option value="usps" ${m.trackingCarrier==='usps'?'selected':''}>USPS</option><option value="ups" ${m.trackingCarrier==='ups'?'selected':''}>UPS</option><option value="fedex" ${m.trackingCarrier==='fedex'?'selected':''}>FedEx</option><option value="other" ${m.trackingCarrier==='other'?'selected':''}>Other</option></select><input id="tracking-${id}" value="${esc(m.trackingNumber||'')}" placeholder="Tracking number"><button class="btn primary" onclick="saveTracking('${id}')">Save tracking</button></div>${notifyLinks(o)}</div></div><div class="admin-row">${o.status==='paid'?`<button class="btn" onclick="setStatus('${id}','pending')">Mark unpaid</button>`:`<button class="btn primary" onclick="setStatus('${id}','paid')">Verify & mark paid</button>`}${o.status!=='payment_reported'?`<button class="btn" onclick="setStatus('${id}','payment_reported')">Mark payment reported</button>`:''}</div></article>`}).join('')||'<article class="order">No orders yet.</article>'}async function saveTracking(id){const trackingNumber=document.getElementById('tracking-'+id).value.trim(),trackingCarrier=document.getElementById('carrier-'+id).value;if(!trackingNumber)return alert('Enter a tracking number.');await req('/api/admin/orders/'+id+'/tracking',{method:'PATCH',body:JSON.stringify({trackingNumber,trackingCarrier})});load()}async function setStatus(id,status){await req('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function login(){try{await req('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(e){$('#err').textContent=e.message}}async function check(){try{const s=await req('/api/admin/session');if(s.authenticated){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}}catch{}}$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#refreshBtn').onclick=load;$('#logoutBtn').onclick=async()=>{await req('/api/admin/logout',{method:'POST'}).catch(()=>{});location.reload()};check();</script></body></html>
