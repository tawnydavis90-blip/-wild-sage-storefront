<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sole Rebel Dashboard</title><style>:root{--bg:#14130f;--panel:#211f19;--line:#373228;--text:#f4efe5;--muted:#b8ad9a;--accent:#a79578;--good:#b7c9a9;--warn:#dbbd83}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,sans-serif}.wrap{max-width:1100px;margin:auto;padding:24px}.brand{font:700 clamp(2rem,6vw,4rem) Georgia,serif;margin:.2rem 0}.eyebrow{letter-spacing:.16em;text-transform:uppercase;color:var(--accent);font-size:.75rem}.login,.card,.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.login{max-width:420px;margin:12vh auto}input{width:100%;padding:12px;border-radius:10px;border:1px solid var(--line);background:#11100d;color:var(--text);margin:10px 0}.btn{border:0;border-radius:10px;background:var(--accent);color:#15130f;padding:10px 14px;font-weight:800;cursor:pointer}.btn.secondary{background:#2c2922;color:var(--text);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin:18px 0}.metric{font:700 2rem Georgia,serif}.muted{color:var(--muted)}.hidden{display:none!important}.table{overflow:auto;border:1px solid var(--line);border-radius:14px}table{width:100%;border-collapse:collapse;min-width:800px}th,td{padding:11px 13px;border-bottom:1px solid var(--line);text-align:left}th{font-size:.75rem;text-transform:uppercase;color:var(--muted);background:#191712}.status{padding:5px 9px;border-radius:999px;background:#2a2720;font-size:.78rem}.status.paid{color:var(--good)}.status.pending{color:var(--warn)}.top{display:flex;justify-content:space-between;align-items:center;gap:12px;flex-wrap:wrap}</style></head><body><div id="login" class="login"><div class="eyebrow">Private dashboard</div><h1 class="brand">Sole Rebel</h1><input id="password" type="password" placeholder="Admin password"><button class="btn" id="loginBtn">Open Dashboard</button><div id="err" class="muted"></div></div><main id="app" class="wrap hidden"><div class="top"><div><div class="eyebrow">Sage & Ember connected</div><h1 class="brand">Sole Rebel Dashboard</h1></div><div><button class="btn secondary" id="refreshBtn">Refresh</button> <button class="btn secondary" id="logoutBtn">Lock</button></div></div><section id="metrics" class="grid"></section><section class="panel"><h2>Orders</h2><div class="table"><table><thead><tr><th>Date</th><th>Order</th><th>Customer</th><th>Color</th><th>Days</th><th>Total</th><th>Status</th><th>Action</th></tr></thead><tbody id="rows"></tbody></table></div></section></main><script>const $=s=>document.querySelector(s),money=n=>'$'+Number(n||0).toFixed(2);async function req(path,options={}){const r=await fetch(path,{credentials:'same-origin',...options,headers:{...(options.body?{'Content-Type':'application/json'}:{}),...(options.headers||{})}}),j=await r.json().catch(()=>({}));if(!r.ok)throw new Error(j.error||'Request failed');return j}function card(l,v){return`<div class="card"><div class="eyebrow">${l}</div><div class="metric">${v}</div></div>`}async function load(){const d=await req('/api/admin/dashboard'),s=d.stats;$('#metrics').innerHTML=[card('24 Hours',s.last24h),card('7 Days',s.last7d),card('Lifetime',s.lifetime),card('Paid',s.paid),card('Unpaid',s.unpaid),card('Paid Revenue',money(s.paid_revenue))].join('');$('#rows').innerHTML=d.orders.map(o=>`<tr><td>${new Date(o.ordered_at).toLocaleString()}</td><td>${o.external_order_id}</td><td>${o.metadata?.customer||'—'}</td><td>${o.metadata?.color||'—'}</td><td>${o.metadata?.daysWorn||'—'}</td><td>${money(o.total)}</td><td><span class="status ${o.status}">${o.status}</span></td><td>${o.status==='paid'?'<button class="btn secondary" onclick="setStatus(\''+o.id+'\',\'pending\')">Mark Unpaid</button>':'<button class="btn" onclick="setStatus(\''+o.id+'\',\'paid\')">Mark Paid</button>'}</td></tr>`).join('')||'<tr><td colspan="8">No orders yet.</td></tr>'}async function setStatus(id,status){await req('/api/admin/orders/'+id,{method:'PATCH',body:JSON.stringify({status})});load()}async function login(){try{await req('/api/admin/login',{method:'POST',body:JSON.stringify({password:$('#password').value})});$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}catch(e){$('#err').textContent=e.message}}async function check(){try{const s=await req('/api/admin/session');if(s.authenticated){$('#login').classList.add('hidden');$('#app').classList.remove('hidden');load()}}catch{}}$('#loginBtn').onclick=login;$('#password').onkeydown=e=>{if(e.key==='Enter')login()};$('#refreshBtn').onclick=load;$('#logoutBtn').onclick=async()=>{await req('/api/admin/logout',{method:'POST'}).catch(()=>{});location.reload()};check();</script></body></html>
