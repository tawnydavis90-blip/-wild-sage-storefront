<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sage & Ember Holdings Dashboard</title>
<style>
:root{--bg:#11130f;--panel:#1a1d17;--soft:#24281f;--text:#f2efe7;--muted:#a8ad9d;--sage:#9aa98b;--line:#34382f;--good:#b8c9a8;--warn:#d6b58a}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.top{display:flex;gap:20px;align-items:flex-end;justify-content:space-between;flex-wrap:wrap}.eyebrow{letter-spacing:.18em;text-transform:uppercase;color:var(--sage);font-size:.76rem}.brand{font-family:Georgia,serif;font-size:clamp(2rem,5vw,4rem);margin:.2rem 0}.muted{color:var(--muted)}button,input{font:inherit}.login{max-width:480px;margin:12vh auto;background:var(--panel);padding:28px;border:1px solid var(--line);border-radius:18px}.login input{width:100%;padding:14px;border-radius:10px;border:1px solid var(--line);background:#0f110d;color:var(--text);margin:10px 0}.btn{border:0;border-radius:10px;background:var(--sage);color:#10120e;padding:12px 16px;font-weight:700;cursor:pointer}.btn.secondary{background:var(--soft);color:var(--text);border:1px solid var(--line)}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:14px;margin:24px 0}.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px}.metric{font-family:Georgia,serif;font-size:2rem;margin-top:6px}.businesses{display:grid;gap:14px}.business{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:18px;display:grid;grid-template-columns:1.4fr repeat(5,1fr);gap:12px;align-items:center}.label{font-size:.75rem;text-transform:uppercase;color:var(--muted);letter-spacing:.08em}.value{font-weight:650;margin-top:4px}.badge{display:inline-block;padding:4px 8px;border-radius:99px;background:var(--soft);font-size:.75rem;color:var(--good)}.detail{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px}.detail-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px}.list{padding:0;margin:8px 0;list-style:none}.list li{padding:9px 0;border-bottom:1px solid var(--line)}.error{color:#f1b3a9;margin-top:10px}.hidden{display:none!important}@media(max-width:900px){.business{grid-template-columns:1fr 1fr}.business .name{grid-column:1/-1}}@media(max-width:520px){.wrap{padding:18px}.business{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="login" class="login"><div class="eyebrow">Private dashboard</div><h1 class="brand">Sage & Ember</h1><p class="muted">Use your Wild Sage admin password to open the holding-company dashboard.</p><input id="password" type="password" autocomplete="current-password" placeholder="Admin password"><button class="btn" id="loginBtn">Open Dashboard</button><div id="loginError" class="error"></div></div>
<main id="app" class="wrap hidden">
<div class="top"><div><div class="eyebrow">Sage & Ember Holdings</div><h1 class="brand">Business HQ</h1><div class="muted">One view across every connected business.</div></div><div><button class="btn secondary" id="refreshBtn">Refresh</button> <button class="btn secondary" id="logoutBtn">Lock</button></div></div>
<section id="metrics" class="grid"></section>
<h2>Businesses</h2><section id="businesses" class="businesses"></section>
<section id="detail" class="detail hidden"></section>
</main>
<script>
let token=sessionStorage.getItem('sageEmberToken')||'';
const $=s=>document.querySelector(s);const money=n=>new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(n||0));
async function api(path){const r=await fetch(path,{headers:{Authorization:`Bearer ${token}`}});if(!r.ok){const j=await r.json().catch(()=>({}));throw new Error(j.error||`Request failed (${r.status})`)}return r.json()}
function metric(label,value,sub=''){return `<div class="card"><div class="label">${label}</div><div class="metric">${value}</div>${sub?`<div class="muted">${sub}</div>`:''}</div>`}
async function load(){const data=await api('/api/holding/summary');const t=data.totals;$('#metrics').innerHTML=[metric('Businesses',t.businesses),metric('Connected Sites',t.sites),metric('Orders',t.orders),metric('Revenue',money(t.revenue)),metric('Expenses',money(t.expenses)),metric('Net',money(t.net)),metric('Sessions · 30d',t.sessions30d)].join('');$('#businesses').innerHTML=data.businesses.filter(b=>b.slug!=='sage-ember-holdings').map(b=>`<article class="business"><div class="name"><div class="label">Business</div><div class="value">${b.name}</div><span class="badge">${b.status}</span></div><div><div class="label">Revenue</div><div class="value">${money(b.revenue)}</div></div><div><div class="label">Expenses</div><div class="value">${money(b.expenses)}</div></div><div><div class="label">Net</div><div class="value">${money(b.net)}</div></div><div><div class="label">Orders</div><div class="value">${b.orders}</div></div><div><div class="label">Sessions 30d</div><div class="value">${b.sessions30d}</div><button class="btn secondary" style="margin-top:9px" onclick="detail('${b.slug}')">View</button></div></article>`).join('')||'<p class="muted">No operating businesses connected yet.</p>';}
async function detail(slug){const d=await api('/api/holding/businesses/'+encodeURIComponent(slug));const b=d.business;$('#detail').classList.remove('hidden');$('#detail').innerHTML=`<div class="top"><div><div class="eyebrow">Business detail</div><h2>${b.display_name}</h2></div><button class="btn secondary" onclick="$('#detail').classList.add('hidden')">Close</button></div><div class="detail-grid"><div><h3>Sites</h3><ul class="list">${d.sites.map(x=>`<li><strong>${x.name}</strong><br><span class="muted">${x.platform||'—'} · ${x.status}</span></li>`).join('')||'<li class="muted">None yet</li>'}</ul></div><div><h3>Orders</h3><ul class="list">${d.orders.map(x=>`<li>${x.status}: <strong>${x.count}</strong> · ${money(x.total)}</li>`).join('')||'<li class="muted">No orders yet</li>'}</ul></div><div><h3>Expenses · 30d</h3><ul class="list">${d.expenses30d.map(x=>`<li>${x.category||'Uncategorized'}: <strong>${money(x.amount)}</strong></li>`).join('')||'<li class="muted">No expenses yet</li>'}</ul></div><div><h3>Activity · 30d</h3><ul class="list">${d.events30d.map(x=>`<li>${x.event_name}: <strong>${x.count}</strong></li>`).join('')||'<li class="muted">No activity yet</li>'}</ul></div></div>`;$('#detail').scrollIntoView({behavior:'smooth',block:'start'})}
async function login(){token=$('#password').value.trim();$('#loginError').textContent='';try{await api('/api/holding/health');sessionStorage.setItem('sageEmberToken',token);$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch(e){token='';$('#loginError').textContent=e.message}}
$('#loginBtn').onclick=login;$('#password').addEventListener('keydown',e=>{if(e.key==='Enter')login()});$('#refreshBtn').onclick=load;$('#logoutBtn').onclick=()=>{sessionStorage.removeItem('sageEmberToken');location.reload()};
(async()=>{if(token){try{await api('/api/holding/health');$('#login').classList.add('hidden');$('#app').classList.remove('hidden');await load()}catch{sessionStorage.removeItem('sageEmberToken');token=''}}})();
</script>
</body></html>
