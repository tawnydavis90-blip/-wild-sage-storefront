<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Order Confirmed | Wild Sage Apparel</title><link rel="stylesheet" href="/styles.css"><style>body{background:#0b0d09;color:#eee7dc}.confirm{max-width:780px;margin:auto;padding:70px 22px}.card{border:1px solid rgba(238,231,220,.18);padding:clamp(24px,5vw,48px);background:#11130f}.mark{font-size:2rem}.confirm h1{font-family:"Cormorant Garamond",serif;font-size:clamp(3rem,8vw,6rem);line-height:.9;margin:.2em 0}.order-number{font-size:1.15rem;letter-spacing:.12em}.rows{margin:28px 0}.row{display:flex;justify-content:space-between;gap:18px;padding:12px 0;border-bottom:1px solid rgba(238,231,220,.12)}.actions{display:flex;gap:12px;flex-wrap:wrap;margin-top:30px}.actions a{padding:14px 20px;border:1px solid #eee7dc;text-decoration:none;color:inherit}.actions a:first-child{background:#eee7dc;color:#11130f}.muted{opacity:.65}.error{color:#d98b7e}</style></head><body><main class="confirm"><a href="/" style="color:inherit;text-decoration:none">WILD SAGE APPAREL</a><section class="card"><div class="mark">✓</div><p class="eyebrow">ORDER RECEIVED</p><h1>It’s officially yours.</h1><p id="intro">We’re confirming your payment and getting your order details ready…</p><div id="details"></div><div class="actions"><a id="trackLink" href="/order-lookup">Track your order →</a><a href="/">Keep shopping</a></div><p class="muted">You’ll receive updates as your order moves into production and ships.</p></section></main><script>const q=new URLSearchParams(location.search),id=q.get('session_id'),intro=document.querySelector('#intro'),details=document.querySelector('#details'),track=document.querySelector('#trackLink');const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(n||0);(async()=>{if(!id){intro.className='error';intro.textContent='We could not find a checkout session for this page.';return}try{const r=await fetch('/api/checkout-status/'+encodeURIComponent(id)),d=await r.json();if(!r.ok)throw new Error(d.error||'Unable to verify order.');intro.textContent='Payment received. Thank you for choosing Wild Sage.';details.innerHTML='<div class="rows"><div class="row"><span>Order</span><strong class="order-number">'+d.orderNumber+'</strong></div><div class="row"><span>Payment</span><strong>'+d.paymentStatus+'</strong></div><div class="row"><span>Status</span><strong>'+d.status+'</strong></div></div>';track.href='/order-lookup?order='+encodeURIComponent(d.orderNumber||'');}catch(e){intro.className='error';intro.textContent=e.message}})();</script></body></html>
