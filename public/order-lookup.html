<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Track Your Order | Wild Sage Apparel</title><meta name="description" content="Look up your Wild Sage Apparel order status and tracking information."><meta name="robots" content="noindex,follow"><link rel="stylesheet" href="/styles.css"><style>body{background:#f3efe7;color:#171914}.lookup{max-width:720px;margin:0 auto;padding:50px 20px 80px}.lookup a{color:inherit}.lookup-card,.result{background:#fff;padding:28px;border-radius:18px;margin-top:24px}.lookup h1{font-size:clamp(2.5rem,8vw,5rem);margin:.2em 0}.lookup label{display:block;margin:16px 0 6px}.lookup input{width:100%;padding:14px;border:1px solid #bbb;border-radius:10px;box-sizing:border-box}.lookup button{margin-top:18px;padding:14px 20px;border:0;border-radius:999px;background:#171914;color:#fff}.lookup button:disabled{opacity:.55}.result-row{display:flex;justify-content:space-between;gap:15px;padding:10px 0;border-bottom:1px solid #eee}.items{margin-top:18px}.tracking{display:inline-block;margin-top:12px}.muted{opacity:.65}.error{color:#8b2828}</style></head><body><main class="lookup"><a href="/">← Back to Wild Sage</a><p class="eyebrow">WILD SAGE APPAREL</p><h1>Track your order.</h1><p>Enter the email address used at checkout and your Wild Sage order number.</p><form id="lookupForm" class="lookup-card"><label for="email">Email</label><input id="email" type="email" autocomplete="email" required><label for="orderId">Order number</label><input id="orderId" placeholder="WS-1001" autocapitalize="characters" required><button id="lookupButton" type="submit">Look Up Order</button><p id="message"></p></form><section id="result" class="result" hidden></section></main><script>const f=document.querySelector('#lookupForm'),m=document.querySelector('#message'),r=document.querySelector('#result'),emailInput=document.querySelector('#email'),orderInput=document.querySelector('#orderId'),button=document.querySelector('#lookupButton');const money=(n,c)=>new Intl.NumberFormat('en-US',{style:'currency',currency:c||'USD'}).format(n||0);const initialOrder=new URLSearchParams(location.search).get('order');if(initialOrder)orderInput.value=initialOrder.toUpperCase();f.onsubmit=async e=>{e.preventDefault();m.className='';m.textContent='Looking up your order…';r.hidden=true;button.disabled=true;try{const x=await fetch('/api/customer/order-lookup',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:emailInput.value.trim(),orderId:orderInput.value.trim().toUpperCase()})}),d=await x.json();if(!x.ok)throw new Error(d.error||'Unable to find that order.');const o=d.order,ful=o.fulfillment;r.innerHTML=`<h2>${o.orderNumber||'Your order'}</h2><div class="result-row"><span>Payment</span><strong>${o.paymentStatus}</strong></div><div class="result-row"><span>Fulfillment</span><strong>${ful?.status||'Processing'}</strong></div><div class="result-row"><span>Total</span><strong>${money(o.total,o.currency)}</strong></div><div class="items"><h3>Items</h3>${(o.items||[]).map(i=>`<div class="result-row"><span>${i.description} × ${i.quantity}</span><strong>${money(i.total,o.currency)}</strong></div>`).join('')}</div>${(ful?.tracking||[]).map(t=>`<p><strong>${t.carrier||'Shipment'}</strong><br>${t.number||''}${t.url?`<br><a class="tracking" href="${t.url}" target="_blank" rel="noopener">Track package →</a>`:''}</p>`).join('')||'<p class="muted">Tracking will appear here when your order ships.</p>'}`;r.hidden=false;m.textContent='';}catch(err){m.className='error';m.textContent=err.message||'Unable to find that order.';}finally{button.disabled=false;}};</script></body></html>
